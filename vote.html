  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    }

      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;

    .btn-nav:hover {
      background: rgba(255,255,255,0.18);
    }
    .btn-nav-primary {
      background: #3b82f6;
      border-color: #2563eb;
    }
    .btn-nav-primary:hover {
      background: #2563eb;
    }
    .frame-container {
      flex: 1;
      width: 100%;
      height: calc(100vh - 54px);

    }

      width: 100%;
      height: 100%;
      border: none;
      background: white;
      display: block;
